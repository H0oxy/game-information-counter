name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Provenance: proves this DLL came from this repo and this workflow.
      # Antivirus vendors and users can verify it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/game_information_counter.dll
      - uses: actions/upload-artifact@v4
        with:
          name: game_information_counter
          path: target/release/game_information_counter.dll
